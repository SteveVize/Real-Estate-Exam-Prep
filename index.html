<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iowa Real Estate Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a study desk. Left = where you are (units), right = the work (Learn / Drill / Test). Plat-map green for national, Iowa gold for state content. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --ink:#18231f; --muted:#5b6964; --line:#d9e0dc;
  --accent:#1d6b54; --accent-soft:#e3f0ea; --iowa:#9a6a12; --iowa-soft:#f8eed8;
  --good:#1f7a3f; --good-soft:#e2f3e7; --bad:#b23a2e; --bad-soft:#f9e4e1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#18211e; --ink:#e6ece9; --muted:#9aaba4; --line:#2c3a35;
    --accent:#5cc39f; --accent-soft:#1d3029; --iowa:#e2b35a; --iowa-soft:#33291a;
    --good:#6fd08f; --good-soft:#1b3122; --bad:#f08a7e; --bad-soft:#3a201d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --ink:#e6ece9; --muted:#9aaba4; --line:#2c3a35;
  --accent:#5cc39f; --accent-soft:#1d3029; --iowa:#e2b35a; --iowa-soft:#33291a;
  --good:#6fd08f; --good-soft:#1b3122; --bad:#f08a7e; --bad-soft:#3a201d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none;margin-right:auto;display:flex;gap:8px;align-items:center}
.brand i{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-radius:2px;background:linear-gradient(90deg,transparent 45%,var(--accent) 45% 55%,transparent 55%),linear-gradient(0deg,transparent 45%,var(--accent) 45% 55%,transparent 55%)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem}
.nav a.on,.nav a:hover{background:var(--accent-soft);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chip{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.chip.ia{background:var(--iowa-soft);color:var(--iowa)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.ulist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.urow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);border-left:4px solid var(--accent)}
.urow.ia{border-left-color:var(--iowa)}
.urow:hover{border-color:var(--accent)}
.urow .num{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.urow .ttl{font-weight:600;line-height:1.25}
.urow .pg{font-size:.8rem;color:var(--muted)}
.marks{display:flex;gap:6px;font-size:.75rem;font-weight:700}
.mk{padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.mk.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.mk.mid{background:var(--iowa-soft);color:var(--iowa);border-color:transparent}
.mk.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 18px}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.prose{max-width:72ch}
.prose p{margin:.55em 0}
.prose ul{margin:.3em 0 .9em;padding-left:1.3em}
.prose li{margin:.2em 0}
.review p{font-weight:600;margin-top:1em}
.tip{background:var(--iowa-soft);border-left:4px solid var(--iowa);padding:10px 14px;border-radius:6px;margin:10px 0}
.tip b{color:var(--iowa);font-size:.8rem;letter-spacing:.06em}
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:6px 0}
details.sec summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.sec[open] summary{border-bottom:1px solid var(--line)}
details.sec .prose{padding:4px 16px 12px}
.pref{font-size:.8rem;color:var(--muted);font-weight:400;white-space:nowrap}
.card{min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.card .face{font-size:1.15rem}
.card .term{font-family:var(--display);font-size:1.8rem;font-weight:700}
.card .lbl{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card .ans{color:var(--accent);font-weight:700}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:transparent}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.q{max-width:760px}
.q .stem{font-size:1.12rem;margin:8px 0 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choice.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.fulltests{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.fulltests{grid-template-columns:1fr}}
.ft{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface)}
.ft.ia{border-left-color:var(--iowa)}
.tbar{position:sticky;top:58px;z-index:4;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:14px 0}
.tlist,.miss{max-width:820px;padding-left:0;list-style:none;margin:0}
.tlist .tq{padding:18px 0;border-bottom:1px solid var(--line)}
.tlist .stem{margin:0 0 10px}
.miss li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.miss .stem{font-size:1.05rem;margin:4px 0 6px}
.why{border-top:1px solid var(--line);padding-top:8px}
.gq{margin:6px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:4px}
.score{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1}
@media (max-width:600px){.tbar{top:0}}
details.sec,.tq,#tconfirm{scroll-margin-top:130px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
input[type=search],input[type=date],select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=search]{width:100%;max-width:560px}
mark{background:var(--iowa-soft);color:var(--ink);padding:0 2px;border-radius:3px}
.hit{padding:12px 0;border-bottom:1px solid var(--line)}
.hit a{font-weight:700;text-decoration:none}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--good);font-weight:700}.no-t{color:var(--bad);font-weight:700}
.sync{font-size:.85rem;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--iowa-soft);color:var(--iowa);font-weight:700;text-decoration:none}
.who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--iowa)}
.plist{display:flex;flex-direction:column;gap:8px;max-width:520px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
input[type=text]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.danger{border:1px solid var(--bad);border-radius:var(--r);padding:18px;background:var(--surface)}
.note{padding:10px 14px;border-radius:8px;background:var(--iowa-soft);border-left:4px solid var(--iowa);margin:0 0 18px}
.hide{display:none!important}
table.br{border-collapse:collapse;width:100%;font-size:.92rem}
table.br td,table.br th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.br td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){.top{position:static}.top-in{padding:8px 12px}.nav a{padding:5px 8px}h1{font-size:1.5rem}.urow{grid-template-columns:30px 1fr}.urow .marks{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home"><i></i>Iowa RE Exam Prep</a>
  <nav class="nav" id="nav">
    <a href="#home" data-r="home">Units</a>
    <a href="#tests" data-r="tests">Tests</a>
    <a href="#book" data-r="book">Exam questions</a>
    <a href="#mock" data-r="mock">Mock exam</a>
    <a href="#weak" data-r="weak">Weak spots</a>
    <a href="#numbers" data-r="numbers">Numbers to know</a>
    <a href="#search" data-r="search">Search</a>
  </nav>
  <span class="sync" id="sync"></span>
</div></header>
<main id="app"><p class="muted">Loading your study guide…</p></main>
<script>
"use strict";
let D=[]; // units
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

/* ---------- profiles + progress (saved in this browser) ---------- */
const BLANK=()=>({rev:{},cards:{},qs:{},tests:{},mocks:[],exam:'',backupAt:0,full:{},fullHist:[]});
const PK='iare-profiles-v1';
let P={list:[],cur:null};
let S=BLANK();
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
try{const v=lsGet(PK); if(v) P=JSON.parse(v);}catch(e){}
// carry over progress saved before profiles existed
(function migrate(){const old=lsGet('iare-progress-v1'); if(old&&!P.list.length){const id='p'+Date.now().toString(36); P.list.push({id,name:'Me',created:Date.now()}); P.cur=id; lsSet('iare-p-'+id,old); lsSet(PK,JSON.stringify(P)); lsDel('iare-progress-v1');}})();
const curProfile=()=>P.list.find(p=>p.id===P.cur)||null;
function loadProfile(){S=BLANK(); const p=curProfile(); if(!p) return; try{const v=lsGet('iare-p-'+p.id); if(v) S=Object.assign(BLANK(),JSON.parse(v));}catch(e){}}
loadProfile();
let saveOK=true;
function save(){const p=curProfile(); if(!p) return; saveOK=lsSet('iare-p-'+p.id,JSON.stringify(S)); setSync();}
function saveProfiles(){lsSet(PK,JSON.stringify(P));}
function setSync(){const el=$('#sync'); const p=curProfile(); if(!el) return;
  el.innerHTML=p?`<a href="#account" class="who" title="Your profile, backup and reset">${esc(p.name)}</a>`+(saveOK?'':' <span class="no-t">Not saving: browser storage is blocked</span>'):'';}
function createProfile(name){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); P.list.push({id,name,created:Date.now()}); P.cur=id; saveProfiles(); loadProfile(); save();}
function switchProfile(id){P.cur=id; saveProfiles(); loadProfile(); setSync();}
function backupFile(){
  const p=curProfile(); S.backupAt=Date.now(); save();
  const body=JSON.stringify({app:'iowa-re-exam-prep',version:1,profile:p.name,exported:new Date().toISOString(),progress:S},null,1);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));
  const d=new Date(); a.download=`exam-prep-backup-${p.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function mergeState(a,b){
  const o=JSON.parse(JSON.stringify(a));
  for(const k of ['rev']) o[k]=Object.assign({},b[k]||{},a[k]||{});
  for(const k of ['cards','qs']){o[k]=o[k]||{}; for(const [id,v] of Object.entries(b[k]||{})){const m=o[k][id]; if(!m||(v.t||0)>(m.t||0)) o[k][id]=v;}}
  o.tests=o.tests||{}; for(const [u,v] of Object.entries(b.tests||{})){const m=o.tests[u]; if(!m) o.tests[u]=v; else o.tests[u]={best:Math.max(m.best,v.best),last:(v.t||0)>(m.t||0)?v.last:m.last,t:Math.max(m.t||0,v.t||0)}}
  const seen=new Set((o.mocks||[]).map(m=>m.t)); o.mocks=(o.mocks||[]).concat((b.mocks||[]).filter(m=>!seen.has(m.t))).sort((x,y)=>x.t-y.t).slice(-30);
  o.exam=a.exam||b.exam||''; return o;
}
function mark(kind,id,ok){const r=S[kind][id]||{h:0,m:0}; ok?r.h++:r.m++; r.last=ok?1:0; r.t=Date.now(); S[kind][id]=r; save();}

/* ---------- content helpers ---------- */
function blocksHTML(bl){
  return bl.map(b=>{
    if(b.t==='ul') return '<ul>'+b.i.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    if(b.x.startsWith('IN PRACTICE')) return '<div class="tip"><b>IN PRACTICE</b><div>'+esc(b.x.slice(11).trim())+'</div></div>';
    return '<p>'+esc(b.x)+'</p>';
  }).join('');
}
const listHTML=l=>l&&l.length?'<ul>'+l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
const blankHTML=s=>esc(s).replace(/_____/g,'<span class="blank">____</span>');
const pg=p=>p?`<span class="pref">Guide p. ${p}</span>`:'';
function unitDeck(u){
  const d=[];
  u.cards.forEach((c,i)=>d.push({id:`${u.n}-t${i}`,k:'term',f:c.f,b:c.b,l:c.l,p:c.p,w:c.weak}));
  u.concept.forEach((c,i)=>d.push({id:`${u.n}-c${i}`,k:'concept',f:c.f,l:c.l,p:c.p}));
  u.cloze.forEach((c,i)=>d.push({id:`${u.n}-z${i}`,k:'cloze',f:c.s,a:c.a,lead:c.lead,full:c.full,p:c.p}));
  return d;
}
function unitStatus(u){
  const deck=unitDeck(u); const known=deck.filter(c=>S.cards[c.id]&&S.cards[c.id].last===1).length;
  const t=S.tests[u.n];
  const seen=deck.some(c=>S.cards[c.id]);
  return {rev:!!S.rev[u.n], drill:seen&&deck.length?Math.round(known/deck.length*100):null, test:t?t.best:null, deck:deck.length};
}
const cls=v=>v==null?'':v>=80?'on':v>=60?'mid':'low';

/* ---------- exam questions from the Exam Prep book ---------- */
let B={topics:[],qs:[]}, BQ=[];
const TOP=id=>B.topics.find(t=>t.id===id);
const L=i=>String.fromCharCode(65+i);
function bookQ(x){const t=TOP(x.t);
  return {id:x.id,book:true,g:x.t,gl:t.t,ia:t.ia,set:x.set,n:x.n,stem:x.q,lead:`${t.t} · ${x.set} #${x.n}`,opts:x.o,a:x.o[x.a],ai:x.a,work:x.work||'',note:x.note||'',ref:`Exam Prep book p. ${x.p}`,guide:x.g||null};}
const topicQs=id=>BQ.filter(q=>q.g===id);
const unitTopics=n=>B.topics.filter(t=>t.units.includes(n));
function qStat(qs){const seen=qs.filter(q=>S.qs[q.id]); const right=seen.filter(q=>S.qs[q.id].last===1).length;
  return {n:qs.length,seen:seen.length,right,pct:seen.length?Math.round(right/seen.length*100):null};}
const bookSets=id=>{const m=new Map(); topicQs(id).forEach(q=>{if(!m.has(q.set)) m.set(q.set,[]); m.get(q.set).push(q);}); return [...m.entries()];};
// Full-exam weights follow the content outline on p. 4 of the book (salesperson counts).
// The book has no question sets for Transfer of Property (6), Practice of Real Estate (6), Mandated Disclosures (3)
// or Specialty Areas (3): Transfer of Property questions come from Property Ownership, the rest from Federal Laws.
const OUTLINE={ll:40,po:16,lu:8,val:6,fin:10,ag:9,con:10,math:9,fed:12};
function bookMock(scope,len){
  const ids=Object.keys(OUTLINE).filter(id=>scope==='all'||(scope==='ia'?id==='ll':id!=='ll'));
  const tot=ids.reduce((a,id)=>a+OUTLINE[id],0);
  const raw=ids.map(id=>({id,x:len*OUTLINE[id]/tot})); raw.forEach(r=>r.k=Math.floor(r.x));
  let left=len-raw.reduce((a,r)=>a+r.k,0); raw.slice().sort((a,b)=>(b.x-b.k)-(a.x-a.k)).forEach(r=>{if(left>0){r.k++;left--;}});
  // questions you've never seen or missed come first
  const fresh=q=>!S.qs[q.id]?0:S.qs[q.id].last===0?1:2;
  return shuffle(raw.flatMap(r=>shuffle(topicQs(r.id)).sort((a,b)=>fresh(a)-fresh(b)).slice(0,r.k)));
}

/* ---------- views ---------- */
function vHome(){
  const all=D.map(unitStatus);
  const rev=all.filter(s=>s.rev).length;
  const deckN=all.reduce((a,s)=>a+s.deck,0);
  const known=Object.values(S.cards).filter(r=>r.last===1).length;
  const tests=Object.values(S.tests).map(t=>t.best); const avg=tests.length?Math.round(tests.reduce((a,b)=>a+b,0)/tests.length):null;
  const bm=S.mocks.filter(m=>m.src==='book'); const lastMock=bm.length?bm[bm.length-1]:null;
  let plan='';
  if(S.exam){

/* drill */
let DR=null;
function startDrill(deck,el,title,onEnd){
  DR={deck,i:0,flip:false,got:0,miss:0,el,title,onEnd}; drawDrill();
}
function drawDrill(){
  const d=DR; if(!d) return;
  if(!d.deck.length){d.el.innerHTML='<p class="muted">No cards here yet.</p>';return;}
  if(d.i>=d.deck.length){
    d.el.innerHTML=`<div class="panel"><h2>Round done</h2><p>You knew <span class="ok-t">${d.got}</span> and missed <span class="no-t">${d.miss}</span> of ${d.deck.length} cards.</p><div class="row"><button class="btn pri" id="again">Drill the ${d.miss} missed</button><button class="btn" id="restart">Start over (shuffled)</button>${d.onEnd||''}</div></div>`;
    const missed=d.deck.filter(c=>S.cards[c.id]&&S.cards[c.id].last===0);
    $('#again').disabled=!missed.length; $('#again').onclick=()=>startDrill(shuffle(missed),d.el,d.title);
    $('#restart').onclick=()=>startDrill(shuffle(d.deck),d.el,d.title); return;
  }
  const c=d.deck[d.i];
  let front,back;
  if(c.k==='term'){front=`<div class="lbl">Term</div><div class="term">${esc(c.f)}</div>`; back=`<div class="lbl">${c.w?'Where the guide mentions it':'From the guide'}</div><div class="face">${esc(c.b)}${listHTML(c.l)}</div>`;}
  else if(c.k==='concept'){front=`<div class="lbl">Complete the list</div><div class="face" style="font-size:1.4rem;font-weight:600">${esc(c.f)} …</div>`; back=`<div class="lbl">${esc(c.f)}</div><div class="face prose">${listHTML(c.l)}</div>`;}
  else {front=`<div class="lbl">${c.lead?esc(c.lead):'Fill in the blank'}</div><div class="face">${blankHTML(c.f)}</div>`; back=`<div class="lbl">Answer: <span class="ans">${esc(c.a)}</span></div><div class="face">${esc(c.full)}</div>`;}
  d.el.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">${esc(d.title||'')} Card ${d.i+1} of ${d.deck.length}</span><span class="small"><span class="ok-t">${d.got} known</span> · <span class="no-t">${d.miss} missed</span></span></div>
   <div class="bar" style="margin-bottom:14px"><i style="width:${d.i/d.deck.length*100}%"></i></div>
   <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">${d.flip?back:front}<div class="pref">${d.flip?'Guide p. '+(c.p||''):'Tap or press Space to flip'}</div></div>
   <div class="row" style="margin-top:14px;justify-content:center">${d.flip?`<button class="btn bad" id="miss">Missed it</button><button class="btn good" id="got">Knew it</button>`:`<button class="btn pri" id="flip">Show answer</button>`}<button class="btn" id="skip">Skip</button></div>
   <p class="muted small" style="text-align:center">Keys: Space flips · 1 missed · 2 knew it</p>`;
  const flip=()=>{d.flip=!d.flip;drawDrill()};
  $('#card').onclick=flip; const f=$('#flip'); if(f) f.onclick=flip;
  const ans=ok=>{mark('cards',c.id,ok); ok?d.got++:d.miss++; d.i++; d.flip=false; drawDrill();};
  if($('#got')){$('#got').onclick=()=>ans(true); $('#miss').onclick=()=>ans(false);}
  $('#skip').onclick=()=>{d.i++;d.flip=false;drawDrill();};
}
document.addEventListener('keydown',e=>{
  if(!DR||!document.getElementById('card')||e.target.tagName==='INPUT') return;
  if(e.key===' '){e.preventDefault();DR.flip=!DR.flip;drawDrill();}
  else if(DR.flip&&(e.key==='1'||e.key==='2')){const ok=e.key==='2';const c=DR.deck[DR.i];mark('cards',c.id,ok);ok?DR.got++:DR.miss++;DR.i++;DR.flip=false;drawDrill();}
});

/* quiz engine */
let QZ=null;
const bookFb=q=>`<div class="why" style="margin-top:8px">${explainHTML(q)}</div><div class="pref">${esc(q.ref)} · ${esc(q.gl)}, ${esc(q.set)} #${q.n}</div>`;
const qRef=q=>q.book?`${esc(q.gl)}, ${esc(q.ref)}`:`Unit ${q.u}, p. ${q.p}`;
const qAns=q=>q.book?L(q.ai)+'. '+esc(q.a):esc(q.a);
function startQuiz(qs,el,opts){QZ={qs,i:0,ans:[],el,opts:opts||{},t0:Date.now()}; drawQuiz();}
function drawQuiz(){
  const z=QZ; if(!z) return;
  if(!z.qs.length){z.el.innerHTML='<p class="muted">This unit of the guide has no key-term list or numbers to quiz on. Use Learn and Drill for it, or take a mock exam.</p>';return;}
  if(z.i>=z.qs.length) return endQuiz();
  const q=z.qs[z.i]; const a=z.ans[z.i];
  z.el.innerHTML=`<div class="q">
   <div class="row" style="justify-content:space-between"><span class="muted">${esc(z.opts.title||'')} Question ${z.i+1} of ${z.qs.length}</span>${z.opts.showUnit?(q.book?`<span class="chip ${q.ia?'ia':''}">${esc(q.gl)}</span>`:`<span class="chip ${q.u>23?'ia':''}">Unit ${q.u}</span>`):''}</div>
   <div class="bar" style="margin:10px 0 16px"><i style="width:${z.i/z.qs.length*100}%"></i></div>
   <div class="muted small" style="font-weight:700">${esc(q.lead)}</div>
   <div class="stem">${blankHTML(q.stem)}</div>
   ${q.k==='term'&&q.l?`<div class="prose small muted">${listHTML(q.l)}</div>`:''}
   <div class="choices">${q.opts.map((o,j)=>`<button class="choice ${a!=null?(o===q.a?'right':(a===o?'wrong':'')):''}" data-j="${j}" ${a!=null?'disabled':''}>${L(j)}. ${esc(o)}</button>`).join('')}</div>
   ${a!=null?`<div class="fb ${a===q.a?'ok':'no'}"><b class="${a===q.a?'ok-t':'no-t'}">${a===q.a?'Correct.':'Not quite. The answer is '+(q.book?L(q.ai)+'. ':'')+esc(q.a).replace(/[.,]$/,'')+'.'}</b>${q.book?bookFb(q):`<div style="margin-top:6px">${esc(q.src)}</div><div class="pref">Guide p. ${q.p} · Unit ${q.u}</div>`}</div>
   <div class="row" style="margin-top:14px"><button class="btn pri" id="next">${z.i+1<z.qs.length?'Next question →':'See results'}</button></div>`:''}
  </div>`;
  z.el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const o=q.opts[+b.dataset.j]; z.ans[z.i]=o; mark('qs',q.id,o===q.a); if(z.opts.onAnswer) z.opts.onAnswer(); drawQuiz();});
  const n=$('#next'); if(n){n.onclick=()=>{z.i++;drawQuiz();window.scrollTo({top:0})}; n.focus();}
}
function endQuiz(){
  const z=QZ; const right=z.qs.filter((q,i)=>z.ans[i]===q.a).length; const score=Math.round(right/z.qs.length*100);
  const mins=Math.round((Date.now()-z.t0)/60000);
  if(z.opts.unit){const t=S.tests[z.opts.unit]||{best:0}; S.tests[z.opts.unit]={best:Math.max(t.best||0,score),last:score,t:Date.now()}; save();}
  if(z.opts.mock){S.mocks.push({t:Date.now(),score,n:z.qs.length,scope:z.opts.scope,src:z.opts.src||'guide'}); S.mocks=S.mocks.slice(-30); save();}
  let br='';
  if(z.opts.mock||z.qs.some(q=>q.book)&&new Set(z.qs.map(q=>q.g)).size>1){
    const by={}; z.qs.forEach((q,i)=>{const k=q.book?'b:'+q.g:'u:'+q.u; by[k]=by[k]||[0,0]; by[k][1]++; if(z.ans[i]===q.a) by[k][0]++;});
    const book=z.qs.some(q=>q.book);
    const lab=k=>k[0]==='b'?`<a href="#book-${k.slice(2)}">${esc(TOP(k.slice(2)).t)}</a>`:`<a href="#unit-${k.slice(2)}-learn">${k.slice(2)}. ${esc(D[k.slice(2)-1].t)}</a>`;
    const ord=k=>k[0]==='b'?B.topics.findIndex(t=>t.id===k.slice(2)):+k.slice(2);
    br=`<h3 style="margin-top:18px">By ${book?'topic':'unit'}</h3><table class="br"><tr><th>${book?'Topic':'Unit'}</th><th class="n">Right</th><th class="n">Score</th></tr>${Object.entries(by).sort((a,b)=>ord(a[0])-ord(b[0])).map(([k,[r,t]])=>`<tr><td>${lab(k)}</td><td class="n">${r}/${t}</td><td class="n ${r/t>=.75?'ok-t':'no-t'}">${Math.round(r/t*100)}%</td></tr>`).join('')}</table>`;
  }
  const wrong=z.qs.map((q,i)=>[q,z.ans[i]]).filter(([q,a])=>a!==q.a);
  z.el.innerHTML=`<div class="panel"><h2>${score}% <span class="muted" style="font-size:1rem">${right} of ${z.qs.length} right${mins?` · ${mins} min`:''}</span></h2>
   <p class="muted">${score>=75?'Strong result. Keep the streak going on another unit.':'Review the misses below, then try again. Missed questions also show up in Weak spots.'}</p>
   <div class="row"><button class="btn pri" id="retry">Try a new set</button>${z.opts.unit?`<a class="btn" href="#unit-${z.opts.unit}-learn">Back to Learn</a>`:''}<a class="btn" href="#weak">Weak spots</a></div>${br}
   ${wrong.length?`<h3 style="margin-top:18px">Review your misses</h3><ul class="list-plain">${wrong.map(([q,a])=>`<li><div>${blankHTML(q.stem)}</div><div class="small"><span class="no-t">You: ${a==null?'skipped':(q.book?L(q.opts.indexOf(a))+'. ':'')+esc(a)}</span> · <span class="ok-t">Answer: ${qAns(q)}</span> · <span class="pref">${qRef(q)}</span></div></li>`).join('')}</ul>`:''}</div>`;
  $('#retry').onclick=()=>z.opts.again&&z.opts.again();
}

  const h=(location.hash||'#home').slice(1);
  const el=$('#app'); DR=null; QZ=null; let keepScroll=false;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',h.startsWith(a.dataset.r)));
  setSync();
  if(!curProfile()||h==='profiles'){el.innerHTML=vWelcome(); afterWelcome(); window.scrollTo({top:0}); return;}
  let m;
  if(h==='account'){el.innerHTML=vAccount(); afterAccount();}
  else if((m=h.match(/^unit-(\d+)-s(\d+)$/))){
    // a link to one section of the study notes: open it and scroll to it
    const n=+m[1], i=+m[2], u=D.find(x=>x.n===n);
    el.innerHTML=vUnit(n,'learn'); if(u){afterLearn(u); const d=document.getElementById(`s-${n}-${i}`); if(d){d.open=true; d.scrollIntoView({block:'start'}); keepScroll=true;}}
  }
  else if((m=h.match(/^unit-(\d+)(?:-(learn|drill|test))?$/))){
    const n=+m[1], tab=m[2]||'learn', u=D.find(x=>x.n===n);
    el.innerHTML=vUnit(n,tab);
    if(u&&tab==='learn'){afterLearn(u); if(OPEN&&OPEN.u===n){const d=OPEN.i>=0?document.getElementById(`s-${n}-${OPEN.i}`):null; if(d){d.open=true;d.scrollIntoView();} OPEN=null;}}
    if(u&&tab==='drill'){const deck=unitDeck(u); const order=[...deck.filter(c=>S.cards[c.id]&&S.cards[c.id].last===0),...shuffle(deck.filter(c=>!(S.cards[c.id]&&S.cards[c.id].last===0)))];
      startDrill(order,$('#drill'),'',`<a class="btn" href="#unit-${n}-test">Next: Test →</a>`);}
    if(u&&tab==='test'){
      const tops=unitTopics(n), bq=tops.flatMap(t=>topicQs(t.id));
      const fresh=q=>!S.qs[q.id]?0:S.qs[q.id].last===0?1:2;
      const goBook=()=>startQuiz(shuffle(bq).sort((a,b)=>fresh(a)-fresh(b)).slice(0,10),$('#test'),{unit:n,showUnit:tops.length>1,title:`Unit ${n} test.`,again:goBook});
      if(bq.length){
        $('#tmode').innerHTML=`<div class="note row" style="justify-content:space-between"><span>10 exam questions from your Exam Prep book's <b>${tops.map(t=>esc(t.t)).join('</b> and <b>')}</b> section${tops.length>1?'s':''}, the part${tops.length>1?'s':''} of the book that cover${tops.length>1?'':'s'} this unit.</span><span class="row">${tops.map(t=>`<a class="btn" href="#book-${t.id}">All ${esc(t.t)} questions</a>`).join('')}</span></div>`;
        goBook();
      } else $('#test').innerHTML=`<div class="panel"><p class="prose">Your Exam Prep book has no question section for this unit's topic. Use Learn and Drill for this unit, and practice with the <a href="#book">exam questions</a>.</p></div>`;
    }
  }
  else if(h==='mock'){el.innerHTML=vMock(); afterMock();}
  else if(h==='book'){el.innerHTML=vBook();}
  else if(h==='tests'){el.innerHTML=vTests();}
  else if((m=h.match(/^full-(ia|nat)$/))){el.innerHTML=vFull(m[1]); afterFull(m[1]);}
  else if((m=h.match(/^full-(ia|nat)-results$/))){el.innerHTML=vFullResults(m[1]);}
  else if((m=h.match(/^book-([a-z]+)$/))&&TOP(m[1])){el.innerHTML=vTopic(m[1]); afterTopic(m[1]);}
  else if(h==='weak'){el.innerHTML=vWeak(); afterWeak();}
  else if(h==='numbers'){el.innerHTML=vNumbers(); afterNumbers();}
  else if(h==='search'){el.innerHTML=vSearch(); afterSearch();}
  else {el.innerHTML=vHome(); afterHome();}
  if(!OPEN&&!keepScroll) window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
Promise.all([fetch('data.json').then(r=>r.json()),fetch('questions.json').then(r=>r.json())])
  .then(([d,b])=>{D=d;B=b;BQ=B.qs.map(bookQ);route();})
  .catch(()=>{$('#app').innerHTML='<p>The study content could not load. Reload the page to try again.</p>';});
</script>
</body>
</html>
